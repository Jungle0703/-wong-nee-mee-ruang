<section id="game" class="screen"><div class="top"><button class="iconbtn" onclick="show('select')">‹</button><button class="pill" onclick="show('select')">เปลี่ยนเกม</button></div><div class="gamehead"><h2 id="gtitle"></h2></div><div id="gdesc" class="muted"></div><div class="panel bigarea" id="arena"></div><div id="controls"></div><div class="result" id="result"><div><h2 id="resultLabel">คืนนี้คนซวยคือ</h2><div class="who" id="resultWho"></div><div id="resultExtra" class="muted"></div><button class="cta" onclick="restartGame()">เล่นอีกครั้ง</button><button class="subcta" onclick="hideResult();show('select')">เลือกเกมอื่น</button></div></div></section>
</main><script>
let players=JSON.parse(localStorage.getItem('half_players')||'null')||['เจ','บอส','มาย','ฟิล์ม'];let sound=true,currentGame='',cleanup=null;
const games=[['wheel','วงล้อมรณะ','RANDOM • 5–18 วิ'],['horse','ม้าเมาซิ่ง','RACE • 15 วิ'],['bomb','ระเบิดส่งต่อ','PASS • ลุ้นเวลา'],['croc','จระเข้งับนิ้ว','LUCK • เลือกฟัน'],['balloon','ลูกโป่งแตก','LUCK • สูบทีละคน'],['ufo','UFO ลักพาตัว','RANDOM • สแกนหาเหยื่อ'],['island','เกาะสุดท้าย','SURVIVAL • รอดคนเดียว'],['toilet','ชักโครกตัน','LUCK • อย่าให้ล้น']];
function svg(type){let s={wheel:'<circle cx="50" cy="50" r="38" fill="#ff4d72"/><circle cx="50" cy="50" r="25" fill="#6f3fd5"/><circle cx="50" cy="50" r="9" fill="#ffd75e"/>',horse:'<path d="M18 62 Q32 38 57 48 Q75 52 82 38 L91 46 L82 68 Q61 78 38 70Z" fill="#e8d0ad"/><circle cx="78" cy="39" r="9" fill="#e8d0ad"/><path d="M38 68v20M67 68v20" stroke="#e8d0ad" stroke-width="6"/>',bomb:'<circle cx="50" cy="58" r="31" fill="#20202a"/><path d="M68 32q18-20 21-4" fill="none" stroke="#d8a15d" stroke-width="5"/><circle cx="91" cy="25" r="7" fill="#ffd43b"/>',croc:'<path d="M8 58 Q35 25 91 48 Q78 75 20 73Z" fill="#36b655"/><path d="M23 55h58" stroke="#fff" stroke-width="8" stroke-dasharray="7 5"/>',balloon:'<ellipse cx="50" cy="47" rx="31" ry="39" fill="#ff3f70"/><path d="M50 86l-6 8h12z" fill="#ff3f70"/>',ufo:'<ellipse cx="50" cy="43" rx="40" ry="15" fill="#8191c4"/><path d="M35 40q4-25 15-25t15 25" fill="#67e8ff88"/><path d="M37 52L20 95h60L63 52z" fill="#e9ff6a55"/>',island:'<ellipse cx="50" cy="60" rx="39" ry="17" fill="#56c966"/><path d="M20 62q30 45 60 0" fill="#795538"/><path d="M50 55V23" stroke="#6b462c" stroke-width="6"/><path d="M50 25q-20-13-27 0q17 5 27 5q16-17 29-5q-12 9-29 7" fill="#49b95a"/>',toilet:'<rect x="28" y="14" width="44" height="28" rx="6" fill="#dbe6f4"/><ellipse cx="50" cy="61" rx="30" ry="24" fill="#dbe6f4"/><ellipse cx="50" cy="57" rx="21" ry="12" fill="#3cb7ee"/>'}[type];return `<svg viewBox="0 0 100 100">${s}</svg>`}
function buildGrid(){gamegrid.innerHTML=games.map(g=>`<button class="card" onclick="openGame('${g[0]}')"><div class="art">${svg(g[0])}</div><h3>${g[1]}</h3><small>${g[2]}</small></button>`).join('')}
function show(id){if(cleanup){cleanup();cleanup=null}document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);if(id==='players')renderPlayers();if(id==='select')buildGrid()}
function renderPlayers(){plist.innerHTML=players.map((p,i)=>`<div class="prow"><input value="${p.replace(/"/g,'&quot;')}" oninput="players[${i}]=this.value"><button class="del" onclick="delPlayer(${i})">×</button></div>`).join('')}
function addPlayer(){if(players.length<10){players.push('ผู้เล่น '+(players.length+1));renderPlayers()}}function delPlayer(i){if(players.length>2){players.splice(i,1);renderPlayers()}}function savePlayers(){players=players.map(x=>x.trim()).filter(Boolean).slice(0,10);while(players.length<2)players.push('ผู้เล่น '+(players.length+1));localStorage.setItem('half_players',JSON.stringify(players));show('select')}function quickStart(){players=['เจ','บอส','มาย','ฟิล์ม'];savePlayers()}
function toggleSound(){sound=!sound;soundBtn.textContent='เสียง: '+(sound?'เปิด':'ปิด')}function beep(f=500,d=.05){if(!sound)return;try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.035;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}function vib(x=20){navigator.vibrate&&navigator.vibrate(x)}function rnd(n){return Math.floor(Math.random()*n)}function choice(a){return a[rnd(a.length)]}function confetti(){for(let i=0;i<32;i++){let d=document.createElement('i');d.className='conf';d.style.left=rnd(100)+'vw';d.style.top='-20px';d.style.background=`hsl(${rnd(360)} 90% 60%)`;d.style.animationDelay=(Math.random()*.35)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),1700)}}
function openGame(id){currentGame=id;show('game');let g=games.find(x=>x[0]===id);gtitle.textContent=g[1];gdesc.textContent=g[2];hideResult();renderGame()}
function restartGame(){hideResult();renderGame()}function hideResult(){result.classList.remove('show')}function endGame(name,label='คืนนี้คนซวยคือ',extra='ฮาล์ฟเลือกแล้ว เถียงไม่ได้'){resultLabel.textContent=label;resultWho.textContent=name;resultExtra.textContent=extra;result.classList.add('show');confetti();beep(880,.15);vib([40,30,70])}
function renderGame(){arena.innerHTML='';controls.innerHTML='';if(currentGame==='wheel')wheelGame();if(currentGame==='horse')horseGame();if(currentGame==='bomb')bombGame();if(currentGame==='croc')crocGame();if(currentGame==='balloon')balloonGame();if(currentGame==='ufo')ufoGame();if(currentGame==='island')islandGame();if(currentGame==='toilet')toiletGame()}
function wheelGame(){let dur=10,rot=0;arena.innerHTML='<div class="wheelwrap"><div class="pointer"></div><div class="wheel" id="wheel"></div></div>';let n=players.length,cols=['#ff4d72','#7347d9','#ff9e45','#2db9b0','#ef5ba1','#5278e8','#8bc34a','#d95b43','#ab47bc','#26a69a'];wheel.style.background=`conic-gradient(${players.map((p,i)=>`${cols[i%cols.length]} ${i*360/n}deg ${(i+1)*360/n}deg`).join(',')})`;players.forEach((p,i)=>{let e=document.createElement('div');e.className='wheelname';e.textContent=p;e.style.transform=`rotate(${i*360/n+180/n}deg) translate(62px,-6px) rotate(90deg)`;wheel.appendChild(e)});controls.innerHTML='<div class="speed"><button onclick="setDur(this,5)">เร็ว 5s</button><button class="on" onclick="setDur(this,10)">ลุ้น 10s</button><button onclick="setDur(this,18)">ทรมาน 18s</button></div><button class="cta" id="spin">หมุนเลย</button>';window.setDur=(b,d)=>{dur=d;document.querySelectorAll('.speed button').forEach(x=>x.classList.remove('on'));b.classList.add('on')};spin.onclick=()=>{spin.disabled=true;let winner=rnd(n),seg=360/n,target=360-(winner*seg+seg/2),start=performance.now(),turns=dur<6?5:dur<15?8:12,total=turns*360+target,lastTick=-1;function frame(t){let x=Math.min(1,(t-start)/(dur*1000)),ease=1-Math.pow(1-x,4),r=rot+total*ease;wheel.style.transform=`rotate(${r}deg)`;let tk=Math.floor(r/seg);if(tk!==lastTick){lastTick=tk;beep(450+Math.min(300,x*300),.025);vib(8)}if(x<1)requestAnimationFrame(frame);else{rot=(rot+total)%360;setTimeout(()=>endGame(players[winner]),300);spin.disabled=false}}requestAnimationFrame(frame)}}
function horseGame(){let rows=players.map((p,i)=>`<div class="lane"><div class="horse" id="h${i}"></div><span class="hname" id="hn${i}">${p}</span></div>`).join('');arena.innerHTML=`<div class="horseTrack">${rows}</div>`;controls.innerHTML='<button class="cta" id="race">ปล่อยม้า!</button>';race.onclick=()=>{race.disabled=true;let prog=players.map(()=>0),speed=players.map(()=>.15+Math.random()*.12),start=performance.now(),done=false;function f(t){let dt=Math.min(40,t-(f.last||t));f.last=t;prog.forEach((v,i)=>{speed[i]+=(Math.random()-.48)*.035;speed[i]=Math.max(.08,Math.min(.38,speed[i]));prog[i]+=speed[i]*dt*.022;let pct=Math.min(88,prog[i]);document.getElementById('h'+i).style.left=`${pct}%`;document.getElementById('hn'+i).style.left=`calc(${pct}% + 38px)`});if(t-start>12000){let order=prog.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]);let win=order[0][1],lose=order.at(-1)[1];prog[win]=100;document.getElementById('h'+win).style.left='88%';done=true;setTimeout(()=>endGame(players[lose],'คนเข้าเส้นชัยคนสุดท้าย',`ผู้ชนะ: ${players[win]}`),500)}if(!done)requestAnimationFrame(f)}requestAnimationFrame(f)}}
function bombGame(){let idx=0,trigger=3+rnd(Math.max(4,players.length*3)),passes=0;arena.innerHTML='<div><div class="status" id="turn"></div><div class="bomb"><div class="fuse"></div><div class="spark"></div></div></div>';controls.innerHTML='<button class="cta" id="pass">ส่งต่อ!</button>';function upd(){turn.textContent='ตาของ '+players[idx]}upd();pass.onclick=()=>{passes++;beep(350+passes*18,.04);vib(18);if(passes>=trigger){arena.classList.add('shake');beep(90,.4);setTimeout(()=>{arena.classList.remove('shake');endGame(players[idx])},450)}else{idx=(idx+1)%players.length;upd()}}}
function crocGame(){let trigger=rnd(8),idx=0;arena.innerHTML='<div><div class="status" id="turn">ตาของ '+players[0]+'</div><div class="croc"><div class="jaw topjaw"></div><div class="jaw botjaw"></div><div class="teeth" id="teeth"></div></div></div>';for(let i=0;i<8;i++){let b=document.createElement('button');b.className='tooth';b.onclick=()=>{if(b.classList.contains('used'))return;b.classList.add('used');beep(520,.04);if(i===trigger){arena.classList.add('shake');setTimeout(()=>{arena.classList.remove('shake');endGame(players[idx])},350)}else{idx=(idx+1)%players.length;turn.textContent='ตาของ '+players[idx]};};teeth.appendChild(b)}controls.innerHTML='<div class="muted" style="text-align:center">เลือกฟันทีละซี่…อย่าโดนซี่ของฮาล์ฟ</div>'}
function balloonGame(){let idx=0,pumps=0,trigger=4+rnd(8);arena.innerHTML='<div><div class="status" id="turn">ตาของ '+players[0]+'</div><div class="balloon" id="bal"></div></div>';controls.innerHTML='<button class="cta" id="pump">สูบ!</button>';pump.onclick=()=>{pumps++;let s=1+pumps*.055;bal.style.transform=`scale(${s})`;beep(300+pumps*35,.05);vib(15);if(pumps>=trigger){bal.classList.add('pop');beep(100,.35);setTimeout(()=>endGame(players[idx]),380)}else{idx=(idx+1)%players.length;turn.textContent='ตาของ '+players[idx]}}}
function ufoGame(){let pos=0;arena.innerHTML='<div class="ufo"></div><div class="beam" id="beam"></div><div class="people" id="people"></div>';people.innerHTML=players.map(p=>`<div class="person">${p.slice(0,3)}</div>`).join('');let target=rnd(players.length),step=0,total=28+rnd(12);function move(){let i=step<total-5?rnd(players.length):target;let els=[...people.children],r=els[i].getBoundingClientRect(),a=arena.getBoundingClientRect();beam.style.left=(r.left-a.left+r.width/2-45)+'px';beep(400+step*5,.025);step++;if(step<=total)setTimeout(move,70+Math.pow(step/total,4)*420);else setTimeout(()=>endGame(players[target],'UFO เอาตัวไปแล้ว','ฮาล์ฟไม่รับคืน'),500)}controls.innerHTML='<button class="cta" id="scan">เริ่มสแกน</button>';scan.onclick=()=>{scan.disabled=true;move()}}
function islandGame(){let alive=players.map((p,i)=>i),running=false;arena.innerHTML='<div class="islands" id="islands"></div>';islands.innerHTML=players.map((p,i)=>`<div class="island" id="isl${i}">${p}</div>`).join('');controls.innerHTML='<button class="cta" id="wave">ปล่อยคลื่น!</button>';wave.onclick=()=>{if(running)return;running=true;wave.disabled=true;function round(){if(alive.length<=1){let w=alive[0];setTimeout(()=>endGame(players[w],'ผู้รอดชีวิต','ฮาล์ฟยอมให้รอดคนเดียว'),500);return}let removeCount=alive.length>4?Math.max(1,Math.floor(alive.length*.35)):1;let removed=[];for(let k=0;k<removeCount&&alive.length>1;k++){let j=rnd(alive.length);removed.push(alive.splice(j,1)[0])}removed.forEach(i=>document.getElementById('isl'+i).classList.add('out'));beep(140,.25);vib([30,20,40]);setTimeout(round,1100)}round()}}
function toiletGame(){let idx=0,flushes=0,trigger=3+rnd(8);arena.innerHTML='<div><div class="status" id="turn">ตาของ '+players[0]+'</div><div class="toilet"><div class="tank"></div><div class="flush"></div><div class="bowl"></div><div class="water" id="water"></div></div></div>';controls.innerHTML='<button class="cta" id="fl">กดชักโครก</button>';fl.onclick=()=>{flushes++;water.style.transform=`scale(${1+flushes*.05}) translateY(${-flushes*2}px)`;beep(220,.12);if(flushes>=trigger){water.style.transform='scale(2.2) translateY(-35px)';arena.classList.add('shake');setTimeout(()=>{arena.classList.remove('shake');endGame(players[idx])},500)}else{idx=(idx+1)%players.length;turn.textContent='ตาของ '+players[idx]}}}
</script></body></html>
