/* players/select */
.title{font-size:30px;line-height:1;margin:14px 0 7px;font-weight:1000;letter-spacing:-1px}.subtitle{margin:0 0 18px;color:#bcaec5;font-size:13px}.plist{display:grid;gap:9px}.prow{display:flex;gap:8px}.prow input{width:100%;height:51px;border-radius:17px;border:1px solid #ffffff18;background:#ffffff0c;color:#fff;padding:0 16px;outline:none;font-weight:800}.del{width:51px;border-radius:17px;background:#ff365520;font-size:24px;color:#ff6a82}.playerActions{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:14px}.gamegrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding-bottom:20px}.card{min-height:178px;border-radius:24px;padding:10px;text-align:left;background:linear-gradient(155deg,#21142e,#0d0a13);border:1px solid #ffffff18;box-shadow:inset 0 1px #ffffff10,0 13px 28px #0006;position:relative;overflow:hidden}.card:active{transform:scale(.975)}.card:before{content:"";position:absolute;width:110px;height:110px;border-radius:50%;background:var(--c,#ff3d6b);filter:blur(55px);opacity:.24;right:-30px;top:-30px}.cardArt{height:104px;border-radius:18px;display:grid;place-items:center;position:relative;overflow:hidden;background:linear-gradient(180deg,#ffffff0c,#0003)}.cardArt svg{width:94%;height:94%;filter:drop-shadow(0 8px 8px #0008)}.card h3{margin:9px 4px 0;font-size:17px;line-height:1.05}.card small{display:block;margin:5px 4px;color:#a999b5;font-size:10px;font-weight:700}

#game{background:#07060b}.gameHead{position:relative;z-index:20}.gameHead h2{text-align:center;font-size:25px;margin:3px 0 2px;font-weight:1000}.gameHead p{text-align:center;margin:0 0 8px;color:#a99ab2;font-size:11px}.arena{height:min(61dvh,590px);min-height:430px;border-radius:30px;position:relative;overflow:hidden;border:1px solid #ffffff19;box-shadow:inset 0 1px #ffffff1a,0 20px 55px #0009;background:#111}.controls{position:relative;z-index:15;margin-top:12px}.scene{position:absolute;inset:0;overflow:hidden}.scene:after{content:"";position:absolute;inset:0;box-shadow:inset 0 -80px 90px #050308b8,inset 0 1px #ffffff12;pointer-events:none}.pixelHalf{position:absolute;right:-28px;bottom:28px;width:235px;height:185px;opacity:.13;filter:grayscale(.08) drop-shadow(0 12px 10px #0008);z-index:1;image-rendering:pixelated;pointer-events:none}.pixelHalf.left{right:auto;left:-38px;transform:scaleX(-1)}.pixelHalf img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}.pixelHalf.laugh{width:150px;height:145px;opacity:1;filter:drop-shadow(0 10px 14px #0009);transform:none!important}.gameLayer{position:absolute;inset:0;z-index:3;pointer-events:none}.shake{animation:shake .38s linear}@keyframes shake{0%,100%{transform:none}15%{transform:translate(-7px,3px) rotate(-.5deg)}30%{transform:translate(8px,-4px) rotate(.5deg)}50%{transform:translate(-5px,-2px)}70%{transform:translate(5px,3px)}}

function horseSVG(i){let coats=['#9b542e','#d5d0c7','#492a21','#bd7c3f','#e4c6a2','#5e3b2b'];let c=coats[i%coats.length],silks=['#ff3f68','#5c7cff','#f3c13a','#43d08c','#a75cff','#ff7a3d'][i%6];return `<svg class="horseBody" viewBox="0 0 120 70"><g stroke="#24150f" stroke-width="7" stroke-linecap="round"><path class="legB" style="transform-origin:50px 43px" d="M50 42l-9 23"/><path class="legF" style="transform-origin:80px 42px" d="M80 42l10 23"/><path class="legF" style="transform-origin:38px 43px" d="M38 43l7 22"/><path class="legB" style="transform-origin:72px 43px" d="M72 43l-5 22"/></g><ellipse cx="58" cy="35" rx="37" ry="20" fill="${c}"/><path d="M82 31Q94 7 105 10Q119 14 111 30L95 38Z" fill="${c}"/><path d="M104 12l4-9 5 12M96 12l-2-9 8 10" fill="#33201b"/><path d="M23 31Q7 20 5 32Q15 40 25 40" fill="#261813"/><ellipse cx="108" cy="19" rx="3" ry="3" fill="#111"/><path d="M45 19h27l10 17H49z" fill="${silks}"/><circle cx="62" cy="13" r="10" fill="#f1bd91"/><path d="M52 12q10-15 22 0" fill="${silks}"/><path d="M65 22l20 13" stroke="#f1bd91" stroke-width="6" stroke-linecap="round"/></svg>`}

function buildGrid(){gamegrid.innerHTML=games.map(g=>`<button class="card" style="--c:${g[3]}" onclick="openGame('${g[0]}')"><div class="cardArt">${cardSVG(g[0])}</div><h3>${g[1]}</h3><small>${g[2]}</small></button>`).join('')}
function show(id){if(cleanup){cleanup();cleanup=null}document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);if(id==='players')renderPlayers();if(id==='select')buildGrid();if(id!=='game')hideResult()}
function renderPlayers(){plist.innerHTML=players.map((p,i)=>`<div class="prow"><input value="${p.replace(/"/g,'&quot;')}" oninput="players[${i}]=this.value"><button class="del" onclick="delPlayer(${i})">×</button></div>`).join('')}
function addPlayer(){if(players.length<10){players.push('ผู้เล่น '+(players.length+1));renderPlayers()}}function delPlayer(i){if(players.length>2){players.splice(i,1);renderPlayers()}}function savePlayers(){players=players.map(x=>x.trim()).filter(Boolean).slice(0,10);while(players.length<2)players.push('ผู้เล่น '+(players.length+1));localStorage.setItem('half_players',JSON.stringify(players));show('select')}
function toggleSound(){sound=!sound;soundBtn&&(soundBtn.textContent='เสียง: '+(sound?'เปิด':'ปิด'));beep(600,.04)}let audioCtx;function beep(f=500,d=.05,type='sine',vol=.035){if(!sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=f;g.gain.value=vol;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.stop(audioCtx.currentTime+d)}catch(e){}}function noise(d=.18){if(!sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();let n=audioCtx.sampleRate*d,b=audioCtx.createBuffer(1,n,audioCtx.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);let s=audioCtx.createBufferSource(),g=audioCtx.createGain();s.buffer=b;g.gain.value=.13;s.connect(g);g.connect(audioCtx.destination);s.start()}catch(e){}}function vib(x=20){navigator.vibrate&&navigator.vibrate(x)}function rnd(n){return Math.floor(Math.random()*n)}function confetti(){for(let i=0;i<34;i++){let d=document.createElement('i');d.className='conf';d.style.left=rnd(100)+'vw';d.style.top='-20px';d.style.background=`hsl(${rnd(360)} 90% 60%)`;d.style.animationDelay=(Math.random()*.3)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),1700)}}
function openGame(id){currentGame=id;show('game');let g=games.find(x=>x[0]===id);gtitle.textContent=g[1];gdesc.textContent=g[2];renderGame()}function restartGame(){hideResult();renderGame()}function hideResult(){result.classList.remove('show')}function endGame(name,label='คืนนี้คนซวยคือ',extra='ฮาล์ฟเลือกแล้ว เถียงไม่ได้'){resultLabel.textContent=label;resultWho.textContent=name;resultExtra.textContent=extra;resultCat.innerHTML=pixelHalf('laugh');let rc=resultCat.querySelector('.pixelHalf');if(rc){rc.style.position='relative';rc.style.inset='auto';rc.style.right='auto';rc.style.bottom='auto';rc.style.width='118px';rc.style.height='112px';rc.style.opacity='1';rc.style.zIndex='1';}result.classList.add('show');confetti();beep(880,.13,'triangle',.06);vib([40,30,70])}
function scene(type,inside='',cat=''){return `<div class="scene scene-${type}">${pixelHalf(cat)}${inside}<div class="gameLayer" id="layer"></div></div>`}

function wheelGame(){let dur=10,rot=0,n=players.length,cols=['#ff4773','#7144d6','#ff9d3d','#2eb9a8','#ef5ba1','#4e78e6','#8bc64b','#d45a42','#a64abb','#23a99c'];arena.innerHTML=scene('wheel','<div class="stageDots"></div><div class="wheelRig"><div class="wheelShadow"></div><div class="pointer"></div><div class="wheelRim"><div class="wheel" id="wheel"></div></div><div class="hub"></div></div>');wheel.style.background=`conic-gradient(${players.map((p,i)=>`${cols[i%cols.length]} ${i*360/n}deg ${(i+1)*360/n}deg`).join(',')})`;players.forEach((p,i)=>{let e=document.createElement('div');e.className='wheelname';e.textContent=p;e.style.transform=`rotate(${i*360/n+180/n}deg) translate(52px,-6px) rotate(90deg)`;wheel.appendChild(e)});controls.innerHTML='<div class="speed"><button onclick="setDur(this,5)">เร็ว 5s</button><button class="on" onclick="setDur(this,10)">ลุ้น 10s</button><button onclick="setDur(this,18)">ทรมาน 18s</button></div><button class="cta" id="spin">หมุนวงล้อ</button>';window.setDur=(b,d)=>{dur=d;document.querySelectorAll('.speed button').forEach(x=>x.classList.remove('on'));b.classList.add('on')};spin.onclick=()=>{spin.disabled=true;let winner=rnd(n),seg=360/n,target=360-(winner*seg+seg/2),start=performance.now(),turns=dur<6?5:dur<15?8:12,total=turns*360+target,last=-1;function f(t){let x=Math.min(1,(t-start)/(dur*1000)),ease=1-Math.pow(1-x,4),r=rot+total*ease;wheel.style.transform=`rotate(${r}deg)`;let tk=Math.floor(r/seg);if(tk!==last){last=tk;beep(520+Math.min(250,x*250),.022,'square',.018);vib(7)}if(x<1)requestAnimationFrame(f);else{rot=(rot+total)%360;setTimeout(()=>endGame(players[winner]),350);spin.disabled=false}}requestAnimationFrame(f)}}
function horseGame(){let count=players.length,density=count>=9?'ultra':count>=7?'dense':'';arena.innerHTML=scene('horse','<div class="moon"></div><div class="grandstand"></div><div class="trackLines"></div><div class="raceBanner">HALF NIGHT DERBY • 12s</div><div class="horseTrack '+density+'" id="horseTrack" style="--horse-count:'+count+'"></div>','left');horseTrack.innerHTML=players.map((p,i)=>`<div class="lane"><div class="runner" id="h${i}">${horseSVG(i)}<i class="dust"></i><span class="hname">${p}</span></div></div>`).join('');controls.innerHTML='<button class="cta" id="race">ปล่อยม้า!</button>';race.onclick=()=>{race.disabled=true;let prog=players.map(()=>0),speed=players.map(()=>.13+Math.random()*.09),start=performance.now(),last=start,finished=false;document.querySelectorAll('.runner').forEach(x=>x.classList.add('running'));function f(t){let dt=Math.min(34,t-last);last=t;prog.forEach((v,i)=>{speed[i]+=(Math.random()-.49)*.012;speed[i]=Math.max(.08,Math.min(.28,speed[i]));if(Math.random()<.012)speed[i]+=.08;if(Math.random()<.008)speed[i]*=.62;prog[i]+=speed[i]*dt*.027;let pct=Math.min(82,prog[i]);document.getElementById('h'+i).style.left=`${pct}%`});if(t-start>12000&&!finished){finished=true;let order=prog.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]),win=order[0][1],lose=order.at(-1)[1];document.getElementById('h'+win).style.left='84%';beep(950,.15,'triangle',.06);setTimeout(()=>{document.querySelectorAll('.runner').forEach(x=>x.classList.remove('running'));endGame(players[lose],'คนเข้าเส้นชัยคนสุดท้าย',`ผู้ชนะ: ${players[win]} • ฮาล์ฟขำคนสุดท้ายแล้ว`)},550)}if(!finished)requestAnimationFrame(f)}requestAnimationFrame(f)}}
function bombGame(){let idx=0,passes=0,trigger=3+rnd(Math.max(5,players.length*3));arena.innerHTML=scene('bomb','<div class="partyLights"></div><div class="status" id="turn" style="position:absolute;top:25px;left:0;right:0;z-index:12"></div><div class="bombWrap" id="bombWrap"><div class="fuse"></div><div class="spark"></div><div class="cap"></div><div class="bomb3d"></div></div><div class="explosion" id="explosion"></div>','left');controls.innerHTML='<button class="cta" id="pass">ส่งต่อ!</button>';function upd(){turn.textContent='ระเบิดอยู่กับ '+players[idx]}upd();pass.onclick=()=>{passes++;bombWrap.classList.add('hot');beep(360+passes*18,.04,'square',.03);vib(18);if(passes>=trigger){pass.disabled=true;setTimeout(()=>{explosion.classList.add('go');arena.classList.add('shake');noise(.35);beep(70,.4,'sawtooth',.09);setTimeout(()=>{arena.classList.remove('shake');endGame(players[idx])},500)},180)}else{idx=(idx+1)%players.length;upd()}}}
function crocGame(){let idx=0,trigger=rnd(8),locked=false;arena.innerHTML=scene('croc','<div class="reeds"></div><div class="status" id="turn" style="position:absolute;top:22px;left:0;right:0;z-index:12"></div><div class="crocRig" id="crocRig"><div class="crocShadow"></div><div class="mouthVoid"></div><div class="crocBottom"></div><div class="crocTop"><i class="eye e1"></i><i class="eye e2"></i><i class="nostril n1"></i><i class="nostril n2"></i></div><div class="teeth" id="teeth"></div></div>','left');turn.textContent='ตาของ '+players[idx];let pos=[[8,2],[31,0],[54,4],[77,1],[16,52],[39,48],[62,52],[84,47]];pos.forEach((p,i)=>{let b=document.createElement('button');b.type='button';b.className='tooth';b.style.left=p[0]+'%';b.style.top=p[1]+'px';if(i>3)b.style.transform='rotate(180deg)';b.addEventListener('pointerup',(ev)=>{ev.preventDefault();if(locked||b.classList.contains('used'))return;b.classList.add('used');beep(610,.04,'triangle',.03);if(i===trigger){locked=true;setTimeout(()=>{crocRig.classList.add('snap');arena.classList.add('shake');noise(.13);beep(105,.18,'square',.08);vib([35,20,80]);setTimeout(()=>{arena.classList.remove('shake');endGame(players[idx])},520)},110)}else{idx=(idx+1)%players.length;turn.textContent='ตาของ '+players[idx]}});teeth.appendChild(b)});controls.innerHTML='<div class="glass" style="padding:12px 14px;border-radius:16px;text-align:center;font-size:12px;font-weight:800">แตะฟันทีละซี่ — ถ้าโดนซี่เจ็บ ปากจะงับทันที</div>'}
function balloonGame(){let idx=0,pumps=0,trigger=5+rnd(8);arena.innerHTML=scene('balloon','<div class="carnival"></div><div class="status" id="turn" style="position:absolute;top:22px;left:0;right:0;z-index:12"></div><div class="balloonRig" id="balloonRig"><div class="balloon" id="bal"></div><div class="pumpStem"></div><div class="pumpHandle"></div><div class="pumpBase"></div>'+[0,1,2,3,4,5].map((_,i)=>`<i class="popFrag" style="left:${110+(i%3)*20}px;top:${110+(i%2)*25}px;--x:${(i-2.5)*55}px;--y:${i%2?-150:-110}px"></i>`).join('')+'</div>');turn.textContent='ตาของ '+players[idx];controls.innerHTML='<button class="cta" id="pump">สูบ!</button>';pump.onclick=()=>{pumps++;let s=1+pumps*.055;bal.style.setProperty('--bs',s);bal.classList.remove('wobble');void bal.offsetWidth;bal.classList.add('wobble');beep(270+pumps*32,.06,'sine',.04);vib(14);if(pumps>=trigger){pump.disabled=true;setTimeout(()=>{balloonRig.classList.add('pop');noise(.18);beep(120,.2,'square',.07);arena.classList.add('shake');setTimeout(()=>{arena.classList.remove('shake');endGame(players[idx])},480)},150)}else{idx=(idx+1)%players.length;turn.textContent='ตาของ '+players[idx]}}}
function ufoGame(){let target=rnd(players.length),step=0,total=24+rnd(10);arena.innerHTML=scene('ufo','<div class="stars"></div><div class="skyline"></div><div class="ufo"></div><div class="ufoLights"></div><div class="beam" id="beam"></div><div class="people" id="people"></div>','left');people.innerHTML=players.map((p,i)=>`<div class="person" data-i="${i}">${p.slice(0,4)}</div>`).join('');controls.innerHTML='<button class="cta" id="scan">เริ่มสแกน</button>';scan.onclick=()=>{scan.disabled=true;function move(){let i=step<total-5?rnd(players.length):target,els=[...people.children],r=els[i].getBoundingClientRect(),a=arena.getBoundingClientRect();beam.style.left=(r.left-a.left+r.width/2)+'px';beep(430+step*6,.025,'sine',.02);step++;if(step<=total)setTimeout(move,70+Math.pow(step/total,4)*380);else{els[target].classList.add('abduct');beep(920,.5,'sine',.04);setTimeout(()=>endGame(players[target],'UFO เอาตัวไปแล้ว','ฮาล์ฟเห็น แต่ฮาล์ฟไม่ช่วย'),800)}}move()}}
function islandGame(){let alive=players.map((p,i)=>i),running=false;arena.innerHTML=scene('island','<div class="cloud c1"></div><div class="cloud c2"></div><div class="ocean"></div><div class="islands" id="islands"></div><div class="bigWave" id="bigWave"></div>','left');islands.innerHTML=players.map((p,i)=>`<div class="island" id="isl${i}">${p}</div>`).join('');controls.innerHTML='<button class="cta" id="wave">ปล่อยคลื่น!</button>';wave.onclick=()=>{if(running)return;running=true;wave.disabled=true;function round(){if(alive.length<=1){let w=alive[0];setTimeout(()=>endGame(players[w],'ผู้รอดชีวิต','ฮาล์ฟยอมให้รอดแค่คนเดียว'),500);return}bigWave.classList.remove('go');void bigWave.offsetWidth;bigWave.classList.add('go');beep(150,.3,'sawtooth',.03);noise(.2);let removeCount=alive.length>4?Math.max(1,Math.floor(alive.length*.32)):1,removed=[];for(let k=0;k<removeCount&&alive.length>1;k++){let j=rnd(alive.length);removed.push(alive.splice(j,1)[0])}setTimeout(()=>{removed.forEach(i=>document.getElementById('isl'+i).classList.add('out'));vib([25,20,35])},360);setTimeout(round,1200)}round()}}
