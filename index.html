<!doctype html><html lang='th'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no'><meta name='theme-color' content='#100d19'><meta name='apple-mobile-web-app-capable' content='yes'><meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'><title>วงนี้มีเรื่อง</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#0b0910;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Thai",sans-serif;height:100%;overflow:hidden}button,input{font:inherit}.app{height:100dvh;max-width:480px;margin:auto;position:relative;overflow:hidden;background:radial-gradient(circle at 50% -10%,#422451 0,#1b1327 32%,#0c0a12 72%)}.screen{position:absolute;inset:0;padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:translateX(25px);transition:.35s ease}.screen.active{opacity:1;pointer-events:auto;transform:none}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:14px;letter-spacing:.5px;color:#ffb45c}.pill{background:#ffffff12;border:1px solid #ffffff18;padding:9px 12px;border-radius:999px;font-size:12px;color:#ddd}.hero{margin:auto 0;text-align:center}.orb{width:190px;height:190px;margin:0 auto 28px;border-radius:50%;position:relative;background:radial-gradient(circle at 35% 30%,#ffd78e,#ff8b45 25%,#a63c6b 58%,#39204d 75%);box-shadow:0 0 70px #ff734b42, inset -18px -25px 35px #240d37aa;animation:float 3s ease-in-out infinite}.orb:before,.orb:after{content:"";position:absolute;border-radius:50%;background:#100d19}.orb:before{width:44px;height:58px;left:45px;top:64px;box-shadow:58px 0 #100d19}.orb:after{width:75px;height:28px;left:58px;top:123px;border-radius:0 0 80px 80px;background:#100d19}.spark{position:absolute;width:7px;height:7px;background:#ffd076;border-radius:50%;box-shadow:0 0 15px #ffb24d}.s1{top:12%;left:7%;animation:pulse 1.5s infinite}.s2{top:22%;right:9%;animation:pulse 1.8s .3s infinite}.s3{bottom:24%;left:15%;animation:pulse 2s .6s infinite}@keyframes float{50%{transform:translateY(-9px) rotate(2deg)}}@keyframes pulse{50%{opacity:.25;transform:scale(.6)}}h1{font-size:43px;line-height:1;margin:0 0 10px;font-weight:950;letter-spacing:-2px}.sub{color:#b9afc7;font-size:16px}.primary{border:0;width:100%;padding:18px;border-radius:20px;background:linear-gradient(135deg,#ffb04f,#ff704d 48%,#e84e7d);color:#1a0c12;font-weight:950;font-size:18px;box-shadow:0 12px 30px #ff6c4a32}.secondary{border:1px solid #ffffff18;background:#ffffff0d;color:#fff;padding:15px;border-radius:18px;font-weight:800}.footer{display:grid;gap:10px}.title{font-size:30px;font-weight:950;margin:22px 0 5px}.desc{color:#9d94aa;margin-bottom:20px}.players{display:grid;gap:10px;overflow:auto;padding-bottom:10px}.player{display:flex;align-items:center;gap:10px;background:#ffffff0c;border:1px solid #ffffff12;border-radius:18px;padding:9px 10px}.avatar{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#ffb24d,#ef5478);display:grid;place-items:center;font-weight:950;color:#24111c}.player input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-weight:800;font-size:16px;min-width:0}.del{border:0;background:#ffffff0c;color:#aaa;width:36px;height:36px;border-radius:12px;font-size:18px}.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:1px solid #ffffff14;background:linear-gradient(160deg,#ffffff10,#ffffff05);border-radius:23px;padding:14px;text-align:left;color:#fff;min-height:185px;position:relative;overflow:hidden}.card.disabled{opacity:.35}.thumb{height:110px;border-radius:16px;margin-bottom:12px;display:grid;place-items:center;position:relative;overflow:hidden}.wheelthumb{background:radial-gradient(circle,#ffcf69 0 8%,#7f4ed7 9% 28%,#f35f78 29% 48%,#482b80 49% 68%,#1e1633 69%)}.horsethumb{background:linear-gradient(#6a345d,#e36f55 55%,#5d3828 56%);}.horsethumb:after{content:'♞  ♞';font-size:45px;letter-spacing:8px;filter:drop-shadow(0 8px 8px #0008)}.card b{font-size:17px}.meta{font-size:11px;color:#a9a0b3;margin-top:4px}.back{border:0;background:#ffffff0d;color:#fff;width:42px;height:42px;border-radius:14px;font-size:20px}.gamehead{display:flex;align-items:center;gap:12px}.gamehead h2{margin:0;font-size:23px}.wheelwrap{flex:1;display:grid;place-items:center;position:relative}.wheelbox{width:min(82vw,360px);aspect-ratio:1;position:relative;filter:drop-shadow(0 25px 35px #0009)}#wheel{width:100%;height:100%;border-radius:50%;border:10px solid #2e243d;box-shadow:inset 0 0 0 4px #dcae62,0 0 0 3px #100d19;transition:none}.pointer{position:absolute;left:50%;top:-7px;transform:translateX(-50%);width:0;height:0;border-left:19px solid transparent;border-right:19px solid transparent;border-top:40px solid #ffd064;filter:drop-shadow(0 5px 5px #0008);z-index:4}.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe49a,#f59a3c 45%,#a54e37);border:6px solid #fff3;box-shadow:0 6px 20px #0008;display:grid;place-items:center;font-weight:950;color:#3a1820}.speed{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.speed button{padding:11px 5px;border-radius:14px;border:1px solid #ffffff14;background:#ffffff0c;color:#aaa;font-weight:800}.speed button.on{background:#ff9d4e;color:#231016;border-color:transparent}.result{position:absolute;inset:0;background:#0a0710dd;backdrop-filter:blur(10px);display:none;place-items:center;z-index:20;padding:24px}.result.show{display:grid}.resultcard{text-align:center;width:100%;background:linear-gradient(160deg,#2b1b3a,#17111f);border:1px solid #ffffff1a;border-radius:30px;padding:35px 20px;box-shadow:0 30px 80px #000}.resultcard .small{color:#bdb0c8}.winner{font-size:42px;font-weight:950;margin:12px 0 25px;color:#ffc45d}.resultbuttons{display:grid;gap:10px}.confetti{position:absolute;width:8px;height:16px;border-radius:2px;animation:fall 1.7s linear forwards}@keyframes fall{to{transform:translate(var(--x),110vh) rotate(720deg);opacity:.2}}
</style></head><body><main class='app'>
<section id='home' class='screen active'><div class='top'><div class='brand'>PARTY GAME</div><div class='pill'>V1 • 2–10 คน</div></div><div class='hero'><div class='orb'><i class='spark s1'></i><i class='spark s2'></i><i class='spark s3'></i></div><h1>วงนี้มีเรื่อง</h1><div class='sub'>คืนนี้ต้องมีคนซวย</div></div><div class='footer'><button class='primary' onclick="go('setup')">เริ่มวง</button></div></section>
<section id='setup' class='screen'><div class='top'><button class='back' onclick="go('home')">‹</button><div class='pill' id='count'>4 คน</div></div><div class='title'>ใครอยู่ในวงบ้าง?</div><div class='desc'>ใส่ชื่อไว้ แล้วเกมจะจัดการที่เหลือเอง</div><div id='players' class='players'></div><div class='footer'><button class='secondary' onclick='addPlayer()'>+ เพิ่มคน</button><button class='primary' onclick='toGames()'>พร้อมแล้ว</button></div></section>
<section id='games' class='screen'><div class='top'><button class='back' onclick="go('setup')">‹</button><div class='pill'>เลือกเกม</div></div><div class='title'>คืนนี้เล่นอะไร?</div><div class='desc'>V1 เปิดเกมแรกให้เล่นเต็มระบบก่อน</div><div class='games'><button class='card' onclick='openWheel()'><div class='thumb wheelthumb'></div><b>วงล้อมรณะ</b><div class='meta'>RANDOM • 5–18 วิ</div></button><button class='card disabled'><div class='thumb horsethumb'></div><b>ม้าเมาซิ่ง</b><div class='meta'>เกมถัดไป</div></button></div></section>
<section id='wheelgame' class='screen'><div class='gamehead'><button class='back' onclick="go('games')">‹</button><div><h2>วงล้อมรณะ</h2><div class='meta'>ปล่อยให้ดวงเลือกคนซวย</div></div></div><div class='wheelwrap'><div class='wheelbox'><div class='pointer'></div><canvas id='wheel' width='700' height='700'></canvas><div class='hub'>หมุน!</div></div></div><div class='speed'><button data-d='5000' class='on'>เร็ว<br><small>5 วิ</small></button><button data-d='10000'>ลุ้น<br><small>10 วิ</small></button><button data-d='18000'>ทรมาน<br><small>18 วิ</small></button></div><button id='spin' class='primary' onclick='spin()'>หมุนเลย</button></section>
<div id='result' class='result'><div class='resultcard'><div class='small'>คืนนี้คนซวยคือ</div><div id='winner' class='winner'></div><div class='resultbuttons'><button class='primary' onclick='again()'>หมุนอีกครั้ง</button><button class='secondary' onclick='changeGame()'>เปลี่ยนเกม</button></div></div></div>
</main><script>
let names=['เจ','บอส','มาย','ฟิล์ม'],duration=5000,rotation=0,spinning=false,lastSeg=-1,audioCtx;
const screens=[...document.querySelectorAll('.screen')];function go(id){screens.forEach(s=>s.classList.toggle('active',s.id===id));}
function renderPlayers(){let p=document.getElementById('players');p.innerHTML='';names.forEach((n,i)=>{let d=document.createElement('div');d.className='player';d.innerHTML=`<div class="avatar">${i+1}</div><input maxlength="12" value="${n}" oninput="names[${i}]=this.value"><button class="del" onclick="delPlayer(${i})">×</button>`;p.appendChild(d)});document.getElementById('count').textContent=names.length+' คน'}
function addPlayer(){if(names.length>=10)return;names.push('คนที่ '+(names.length+1));renderPlayers()}function delPlayer(i){if(names.length<=2)return;names.splice(i,1);renderPlayers()}function toGames(){names=names.map((n,i)=>n.trim()||'คนที่ '+(i+1));go('games')}
function openWheel(){go('wheelgame');requestAnimationFrame(drawWheel)}
const colors=['#f15d78','#7a4fd1','#f2a54a','#3e9d9a','#db5fa9','#5d72d8','#e8794d','#7650a9','#48a67f','#d7a43c'];
function drawWheel(){let c=document.getElementById('wheel'),x=c.getContext('2d'),N=names.length,arc=Math.PI*2/N;x.clearRect(0,0,c.width,c.height);for(let i=0;i<N;i++){x.beginPath();x.moveTo(350,350);x.arc(350,350,340,i*arc,(i+1)*arc);x.fillStyle=colors[i%colors.length];x.fill();x.save();x.translate(350,350);x.rotate(i*arc+arc/2);x.textAlign='right';x.fillStyle='white';x.font='800 34px -apple-system, sans-serif';x.shadowColor='#0007';x.shadowBlur=6;x.fillText(names[i],300,11);x.restore()}x.beginPath();x.arc(350,350,338,0,Math.PI*2);x.strokeStyle='#ffffff22';x.lineWidth=5;x.stroke()}
document.querySelectorAll('.speed button').forEach(b=>b.onclick=()=>{if(spinning)return;document.querySelectorAll('.speed button').forEach(x=>x.classList.remove('on'));b.classList.add('on');duration=+b.dataset.d});
function tone(freq=900,ms=25,vol=.025){try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.type='sine';g.gain.value=vol;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+ms/1000);o.stop(audioCtx.currentTime+ms/1000)}catch(e){}}
function vib(ms){try{navigator.vibrate?.(ms)}catch(e){}}
function spin(){if(spinning)return;spinning=true;document.getElementById('spin').disabled=true;let N=names.length,idx=Math.floor(Math.random()*N),arc=360/N;let targetCenter=270-(idx*arc+arc/2);let current=((rotation%360)+360)%360;let delta=((targetCenter-current)%360+360)%360;let rounds=duration<7000?7:duration<15000?11:16;let startRot=rotation,endRot=rotation+rounds*360+delta,start=performance.now();lastSeg=-1;tone(450,70,.04);function frame(now){let t=Math.min(1,(now-start)/duration);let eased=1-Math.pow(1-t,4.2);rotation=startRot+(endRot-startRot)*eased;document.getElementById('wheel').style.transform=`rotate(${rotation}deg)`;let seg=Math.floor((((-rotation+270)%360+360)%360)/arc);if(seg!==lastSeg){lastSeg=seg;tone(t>.8?1050:780,22,t>.85?.035:.018);if(t>.82)vib(8)}if(t<1)requestAnimationFrame(frame);else{rotation=endRot;spinning=false;document.getElementById('spin').disabled=false;vib(90);setTimeout(()=>showResult(idx),350)}}requestAnimationFrame(frame)}
function showResult(i){document.getElementById('winner').textContent=names[i];document.getElementById('result').classList.add('show');confetti();tone(620,220,.06);setTimeout(()=>tone(880,260,.05),130)}function confetti(){for(let i=0;i<36;i++){let e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'%';e.style.top='-20px';e.style.background=colors[i%colors.length];e.style.setProperty('--x',(Math.random()*180-90)+'px');e.style.animationDelay=Math.random()*.45+'s';document.querySelector('.app').appendChild(e);setTimeout(()=>e.remove(),2300)}}function again(){document.getElementById('result').classList.remove('show')}function changeGame(){document.getElementById('result').classList.remove('show');go('games')}renderPlayers();
</script></body></html>
